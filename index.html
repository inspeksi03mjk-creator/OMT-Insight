<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMT Insight</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}
h2{
    text-align:center;
}
#map{
    height:90vh;
}
</style>
</head>

<body>

<h2>OMT Insight - Peta Inspeksi</h2>
    <button onclick="lokasiSaya()">📍 Lokasi Saya</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map=L.map('map').setView([-7.47,112.43],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

map.on('click',function(e){
L.marker(e.latlng).addTo(map)
.bindPopup("Titik Inspeksi")
.openPopup();
    function lokasiSaya(){

if(!navigator.geolocation){
alert("GPS tidak didukung");
return;
}

navigator.geolocation.getCurrentPosition(function(pos){

var lat=pos.coords.latitude;
var lng=pos.coords.longitude;

map.setView([lat,lng],18);

L.marker([lat,lng]).addTo(map)
.bindPopup("📍 Saya di sini")
.openPopup();

},function(err){
alert("GPS gagal : "+err.message);
});

    }
});
</script>

</body>
</html>
