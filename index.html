<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMT Insight - Peta & Inspeksi</title>
    
    <!-- FIX MUTLAK: Menyisipkan CSS Leaflet Core langsung di dalam skrip agar tidak pecah/terblokir -->
    <style>
        /* Leaflet Core CSS CSS */
        .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-map-pane svg,.leaflet-map-pane canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
        .leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;cursor:default;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
        .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
        .leaflet-tile{filter:inherit;visibility:hidden}
        .leaflet-tile-loaded{visibility:inherit}
        .leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}
        .leaflet-pane{z-index:400}
        .leaflet-tile-pane{z-index:200}
        .leaflet-overlay-pane{z-index:400}
        .leaflet-marker-pane{z-index:600}
        .leaflet-shadow-pane{z-index:500}
        .leaflet-map-pane svg{z-index:200}
        .leaflet-map-pane canvas{z-index:100}
        .leaflet-vml-shape{width:1px;height:1px}
        .lvml{behavior:url(#default#VML);display:inline-block;position:absolute}
        .leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
        .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
        .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
        .leaflet-control{margin-left:10px;margin-top:10px}
        .leaflet-top .leaflet-control{margin-top:10px}
        .leaflet-bottom .leaflet-control{margin-bottom:10px}
        .leaflet-right .leaflet-control{float:right;margin-right:10px}
        
        /* Desain Tata Letak Form & Peta */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }
        #map { 
            height: 280px; 
            width: 100%; 
            position: relative;
            border-bottom: 3px solid #007bff;
        }
        .container-inspeksi {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; font-weight: bold;
            font-size: 13px; margin-bottom: 5px; color: #333;
        }
        .form-control {
            width: 100%; padding: 10px;
            border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
            background-color: #fff;
        }
        .row-flex { display: flex; gap: 10px; }
        .row-flex .form-group { flex: 1; }
        .btn {
            color: white; border: none; padding: 12px;
            border-radius: 5px; cursor: pointer; font-size: 14px;
            font-weight: bold; width: 100%; margin-bottom: 15px;
            display: block; text-align: center;
        }
        .btn-primary { background-color: #007bff; }
        .btn-success { background-color: #28a745; margin-top: 10px; }
        
        #preview-foto {
            display: none; width: 80px; height: 80px;
            margin-top: 8px; object-fit: cover;
            border-radius: 5px; border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <!-- 1. Area Peta Terkunci -->
    <div id="map"></div>
    
    <!-- 2. Area Formulir Inspeksi -->
    <div class="container-inspeksi">
        <button class="btn btn-primary" id="btn-lokasi" type="button">📍 Ambil Lokasi GPS Saya</button>
        
        <form id="form-inspeksi" action="https://api.sheetmonkey.io/form/7xzGdPYYcf852R6juhDHCp" method="POST">
            
            <div class="row-flex">
                <div class="form-group">
                    <label>Tanggal & Jam</label>
                    <input type="text" id="input-waktu" name="WAKTU" class="form-control" readonly required placeholder="Otomatis GPS">
                </div>
                <div class="form-group">
                    <label>Koordinat (Lat, Lng)</label>
                    <input type="text" id="input-koordinat" name="KOORDINAT" class="form-control" placeholder="Klik peta / GPS" readonly required>
                </div>
            </div>

            <div class="form-group">
                <label for="no-tiang">Nomor Tiang</label>
                <input type="text" id="no-tiang" name="NOMER TIANG" class="form-control" placeholder="Contoh: T.OMT-04" required>
            </div>

            <div class="row-flex">
                <div class="form-group">
                    <label for="penyulang">Penyulang</label>
                    <input type="text" id="penyulang" name="PENYULANG" class="form-control" placeholder="Nama Penyulang" required>
                </div>
                <div class="form-group">
                    <label for="gardu">Gardu</label>
                    <input type="text" id="gardu" name="GARDU" class="form-control" placeholder="Nama Gardu" required>
                </div>
            </div>

            <div class="form-group">
                <label for="kondisi">Kondisi Tiang/Fasilitas</label>
                <select id="kondisi" name="KONDISI" class="form-control" required>
                    <option value="">-- Pilih Kondisi --</option>
                    <option value="Aman / Normal">Aman / Normal</option>
                    <option value="Tersentuh Pohon">Tersentuh Pohon (Perlu Perintisan)</option>
                    <option value="Retak / Miring">Tiang Retak / Miring</option>
                    <option value="Isolator Rusak">Isolator Rusak/Flash</option>
                </select>
            </div>

            <div class="form-group">
                <label for="foto-file">Foto Kondisi Lapangan</label>
                <input type="file" id="foto-file" class="form-control" accept="image/*" capture="environment" required>
                <img id="preview-foto" alt="Preview">
                <input type="hidden" id="link-foto-hidden" name="Link Foto">
            </div>

            <button type="submit" class="btn btn-success">💾 Simpan Data Inspeksi</button>
        </form>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        var map = L.map('map', {zoomControl: false}).setView([-7.46, 112.42], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // Memaksa peta me-render ulang ukuran bidangnya secara konstan
        setTimeout(function(){ map.invalidateSize(); }, 400);

        var marker;

        function updateMarkerAndForm(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }
            map.setView([lat, lng], 16);
            
            document.getElementById('input-koordinat').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            
            var sekarang = new Date();
            var waktuString = sekarang.toLocaleDateString('id-ID') + ' ' + sekarang.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('input-waktu').value = waktuString;
        }

        map.on('click', function(e) {
            updateMarkerAndForm(e.latlng.lat, e.latlng.lng);
        });

        document.getElementById('btn-lokasi').addEventListener('click', function() {
            map.locate({setView: true, maxZoom: 16});
        });

        map.on('locationfound', function(e) {
            updateMarkerAndForm(e.latlng.lat, e.latlng.lng);
        });

        map.on('locationerror', function(e) {
            alert("GPS aktif? Pastikan izin lokasi browser diizinkan.");
        });

        // Modul Unggah Gambar Cloudinary Aman
        document.getElementById('foto-file').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            document.getElementById('link-foto-hidden').value = "⏳ Memproses foto...";

            var reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                var img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    var MAX_WIDTH = 1000;
                    var scale = MAX_WIDTH / img.width;
                    
                    if (img.width > MAX_WIDTH) {
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scale;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(function(blob) {
                        var imgElement = document.getElementById('preview-foto');
                        imgElement.src = URL.createObjectURL(blob);
                        imgElement.style.display = 'block';

                        document.getElementById('link-foto-hidden').value = "⏳ Mengunggah foto...";

                        var formData = new FormData();
                        formData.append('file', blob);
                        formData.append('upload_preset', 'omt_insight'); 

                        fetch('https://api.cloudinary.com/v1_1/dkgw78y4b/image/upload', {
                            method: 'POST',
                            body: formData
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.secure_url) {
                                document.getElementById('link-foto-hidden').value = data.secure_url;
                            } else {
                                document.getElementById('link-foto-hidden').value = "Gagal memproses link gambar";
                            }
                        })
                        .catch(err => {
                            document.getElementById('link-foto-hidden').value = "Koneksi upload terputus";
                        });
                    }, 'image/jpeg', 0.8);
                };
            };
        });

        document.getElementById('form-inspeksi').addEventListener('submit', function(e) {
            e.preventDefault();
            var form = e.target;
            var currentPhotoVal = document.getElementById('link-foto-hidden').value;

            if(currentPhotoVal.includes("⏳") || currentPhotoVal === "") {
                alert("Tunggu sebentar, foto sedang diunggah!");
                return;
            }

            var btnSimpan = form.querySelector('button[type="submit"]');
            btnSimpan.innerHTML = "⏳ Mengirim data...";
            btnSimpan.disabled = true;

            var formData = new FormData(form);
            var searchParams = new URLSearchParams();
            for (var pair of formData.entries()) {
                searchParams.append(pair[0], pair[1]);
            }

            fetch(form.action, {
                method: 'POST',
                body: searchParams,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            })
            .then(function() {
                alert("✅ DATA & FOTO TERSIMPAN SEMPURNA!");
                form.reset();
                document.getElementById('preview-foto').style.display = 'none';
                btnSimpan.innerHTML = "💾 Simpan Data Inspeksi";
                btnSimpan.disabled = false;
            })
            .catch(function(error) {
                alert("❌ Gagal mengirim ke Google Sheets.");
                btnSimpan.innerHTML = "💾 Simpan Data Inspeksi";
                btnSimpan.disabled = false;
            });
        });
    </script>
</body>
</html>
